<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gambia Vehicle Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .phone-container { width: 100%; max-width: 450px; background: white; min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border-radius: 12px; overflow: hidden; }
    .hero-section { padding: 40px 24px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .app-logo { font-size: 50px; margin-bottom: 15px; }
    h1 { font-size: 26px; font-weight: 800; margin-bottom: 10px; }
    p { color: #6c757d; font-size: 15px; margin-bottom: 40px; }
    .main-scan-btn { width: 85%; background: #2b8a3e; color: white; padding: 18px; border-radius: 12px; font-weight: 700; font-size: 18px; border: none; cursor: pointer; box-shadow: 0 8px 20px rgba(43,138,62,0.25); }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 100; padding: 20px; backdrop-filter: blur(4px); }
    .modal-content { background: white; width: 100%; max-width: 400px; border-radius: 20px; padding: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; }
    .modal-header { font-size: 20px; font-weight: 700; margin-bottom: 18px; display: flex; justify-content: space-between; }
    .close-modal { cursor: pointer; color: #adb5bd; font-size: 24px; }
    .camera-label { display: block; background: #e8f5e9; border: 2px dashed #2b8a3e; border-radius: 12px; padding: 25px; cursor: pointer; color: #2b8a3e; font-weight: 700; margin-bottom: 15px; }
    #camera-input { display: none; }
    .input-field { width: 100%; padding: 14px; border: 2px solid #e9ecef; border-radius: 10px; font-size: 16px; margin-bottom: 15px; text-transform: uppercase; font-weight: 600; text-align: center; color: #111; }
    .submit-btn { width: 100%; background: #111; color: white; padding: 15px; border-radius: 10px; font-weight: 600; border: none; cursor: pointer; font-size: 16px; margin-bottom: 10px; }
    .report-text { background: #f8f9fa; border: 1px solid #e9ecef; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: left; font-size: 14px; white-space: pre-wrap; max-height: 300px; overflow-y: auto; color: #222; }
    .system-share-btn { width: 100%; display: block; background: #1c7ed6; color: white; padding: 14px; border-radius: 10px; font-weight: 700; border: none; margin-bottom: 10px; text-align: center; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>

<div class="phone-container">
  <div class="hero-section">
    <div class="app-logo">🇬🇲</div>
    <h1>Gambia Vehicle Tracker</h1>
    <p>Scan or enter official government registration numbers to check financial allocations instantly.</p>
    <button class="main-scan-btn" onclick="toggleModal('scanModal', true)">Scan / Enter Plate</button>
  </div>
</div>

<!-- INPUT TRIGGER MODAL -->
<div class="modal" id="scanModal">
  <div class="modal-content">
    <div class="modal-header">
      <span>Scan License Identifier</span>
      <span class="close-modal" onclick="toggleModal('scanModal', false)">&times;</span>
    </div>
    <label for="camera-input" class="camera-label">📸 Launch Camera Scanner</label>
    <input type="file" accept="image/*" capture="environment" id="camera-input" onchange="handleCameraScan()">
    <div style="color:#adb5bd; margin-bottom:15px; font-size:12px; font-weight:600; letter-spacing: 0.5px;">OR ENTER MANUALLY</div>
    <input type="text" id="plateInput" class="input-field" placeholder="e.g. GG 1101 A">
    <button class="submit-btn" onclick="submitManualScan()">Analyze Spent Funds</button>
  </div>
</div>

<!-- OUTPUT METRICS MODAL -->
<div class="modal" id="reportModal">
  <div class="modal-content">
    <div class="modal-header">
      <span>📋 Spending Analysis</span>
      <span class="close-modal" onclick="toggleModal('reportModal', false)">&times;</span>
    </div>
    <div class="report-text" id="reportContent">Loading...</div>
    <!-- New Native Sharing Hook Options -->
    <button id="nativeShareBtn" class="system-share-btn" onclick="triggerNativeShare()">Share Report</button>
    <button class="submit-btn" onclick="copyReportText()">Copy Full Report Text</button>
  </div>
</div>

<script>
  let shareText = "";

  function toggleModal(id, show) { 
    document.getElementById(id).style.display = show ? 'flex' : 'none'; 
  }

  function handleCameraScan() {
    toggleModal('scanModal', false);
    sendRequest("GG 1101 A");
  }

  function submitManualScan() {
    const val = document.getElementById('plateInput').value.trim();
    if(!val) {
      alert("Please type a valid license plate string.");
      return;
    }
    toggleModal('scanModal', false);
    sendRequest(val);
  }

  async function sendRequest(plate) {
    try {
      const res = await fetch(`/api/scan?plate=${encodeURIComponent(plate)}`);
      const payload = await res.json();
      if(!res.ok) {
        alert(payload.error || "Verification issue encountered.");
        return;
      }
      renderOutput(payload.data);
    } catch(err) {
      alert("Error connecting to API logic. Double check that api/scan.js is saved in your repository.");
    }
  }

  function renderOutput(d) {
    shareText = `🚨 GAMBIA VEHICLE TRANSPARENCY REPORT 🚨\n` +
                `Plate: ${d.plate.toUpperCase()}\n` +
                `Model: ${d.model}\n` +
                `Engine Size: ${d.engine}\n` +
                `Tank Size: ${d.tankSizeLitre} L\n\n` +
                `💰 BUDGET IMPACT:\n` +
                `- Market Value: D ${d.breakdown.vehicleCost.toLocaleString()}\n` +
                `- Cost of 1 Full Tank: D ${d.breakdown.singleTankCost.toLocaleString()}\n` +
                `- 5-Year Fuel Cost: D ${d.breakdown.fuelCost.toLocaleString()}\n` +
                `- Grand Total Cost: D ${d.breakdown.grandTotal.toLocaleString()}\n\n` +
                `🌾 ALTERNATIVE PUBLIC VALUE:\n` +
                `- Bags of Rice (50kg): ${d.equivalents.rice.toLocaleString()}\n` +
                `- Farm Tractors: ${d.equivalents.tractors}\n` +
                `- Clinic Air Conditioners: ${d.equivalents.acUnits}\n` +
                `- Hospital Ward Beds: ${d.equivalents.beds}\n\n` +
                `#GambiaBudgetTracker 🇬🇲`;

    document.getElementById('reportContent').innerText = shareText;
    toggleModal('reportModal', true);
  }

  // Uses the user device's native sharing sheet options launcher
  async function triggerNativeShare() {
    if (navigator.share) {
      try {
        await navigator.share({
          title: 'Gambia Vehicle Transparency Report',
          text: shareText
        });
      } catch (err) {
        console.log("Share sheet cancelled or interrupted.");
      }
    } else {
      // Fallback if browser security controls restrict direct share access
      navigator.clipboard.writeText(shareText);
      alert("System Share not supported on this browser context. Report text has been copied to your clipboard instead!");
    }
  }

  function copyReportText() {
    navigator.clipboard.writeText(shareText);
    alert("Full vehicle report text copied! Ready to paste into TikTok or Facebook.");
  }
</script>
</body>
</html>
