<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gambia Vehicle Accountability App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f8f9fa; color: #333; display: flex; justify-content: center; }
    .phone-container { width: 100%; max-width: 450px; background: white; min-height: 100vh; position: relative; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
    
    /* Header Navbar */
    .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f3f5; }
    .header h1 { font-size: 28px; font-weight: 700; color: #111; }
    .header-icons { font-size: 22px; cursor: pointer; display: flex; gap: 15px; }

    /* History Feed */
    .history-feed { padding: 15px; flex-grow: 1; overflow-y: auto; padding-bottom: 100px; }
    .history-item { display: flex; gap: 15px; padding: 15px 0; border-bottom: 1px solid #f8f9fa; align-items: center; }
    .car-thumb { width: 70px; height: 70px; background: #e9ecef; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; border: 1px solid #dee2e6; color: #495057; text-align: center; }
    .item-details { flex-grow: 1; }
    .item-title { font-weight: 600; font-size: 16px; margin-bottom: 2px; }
    .item-subtitle { color: #6c757d; font-size: 14px; margin-bottom: 6px; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot-red { background: #fa5252; } .dot-orange { background: #fd7e14; } .dot-green { background: #40c057; }
    .time-stamp { color: #adb5bd; font-size: 12px; margin-top: 4px; display: flex; align-items: center; gap: 4px; }

    /* Sticky Scan Button */
    .scan-btn { position: fixed; bottom: 85px; right: 20px; background: #37b24d; color: white; padding: 14px 24px; border-radius: 30px; font-weight: 600; font-size: 16px; border: none; display: flex; align-items: center; gap: 10px; cursor: pointer; box-shadow: 0 8px 16px rgba(55,178,77,0.3); z-index: 10; }

    /* Bottom Navigation Bar */
    .nav-bar { position: sticky; bottom: 0; background: white; border-top: 1px solid #efefef; display: flex; justify-content: space-around; padding: 12px 0; font-size: 12px; color: #868e96; z-index: 9; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; flex: 1; }
    .nav-item.active { color: #e8590c; font-weight: 600; }

    /* Modals */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    .modal-content { background: white; width: 100%; max-width: 400px; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
    .modal-header { font-size: 20px; font-weight: 700; margin-bottom: 15px; display: flex; justify-content: space-between; }
    .close-modal { cursor: pointer; color: #adb5bd; }
    .input-field { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 8px; font-size: 16px; margin-bottom: 15px; text-transform: uppercase; }
    .submit-btn { width: 100%; background: #212529; color: white; padding: 14px; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; font-size: 16px; }
    
    /* Metrics Display */
    .report-card { background: #f1f3f5; padding: 15px; border-radius: 10px; margin-bottom: 15px; font-size: 14px; }
    .report-title { font-weight: bold; border-bottom: 1px solid #dee2e6; padding-bottom: 5px; margin-bottom: 10px; }
    .report-line { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .equiv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .equiv-box { background: #e8f7ff; border: 1px solid #bbeeec; padding: 12px; border-radius: 8px; text-align: center; }
    .equiv-val { font-size: 18px; font-weight: 700; color: #1c7ed6; }
    .equiv-lbl { font-size: 11px; color: #495057; margin-top: 2px; }

    /* Share Actions */
    .share-row { display: flex; gap: 10px; margin-top: 15px; }
    .share-btn { flex: 1; padding: 10px; border-radius: 6px; border: none; font-weight: 600; font-size: 13px; color: white; cursor: pointer; text-align: center; text-decoration: none; }
    .wa-btn { background: #25D366; } .fb-btn { background: #1877F2; } .tt-btn { background: #010101; }
  </style>
</head>
<body>

<div class="phone-container">
  <div class="header">
    <h1>History</h1>
    <div class="header-icons"><span>★</span><span>⋮</span></div>
  </div>

  <div class="history-feed" id="historyFeed">
    <div class="history-item">
      <div class="car-thumb">GG</div>
      <div class="item-details">
        <div class="item-title">GG 0058 A</div>
        <div class="item-subtitle">Toyota Land Cruiser 300 VXR</div>
        <div class="status-badge"><span class="status-dot dot-red"></span>High Impact Expenses</div>
        <div class="time-stamp">⏱ 4 hours ago</div>
      </div>
    </div>
  </div>

  <button class="scan-btn" onclick="openScanModal()">Scan Plate</button>

  <div class="nav-bar">
    <div class="nav-item active"><span>History</span></div>
    <div class="nav-item"><span>Recs</span></div>
    <div class="nav-item"><span>Overview</span></div>
  </div>
</div>

<!-- Modal 1: Input Scanner Prompt -->
<div class="modal" id="scanModal">
  <div class="modal-content">
    <div class="modal-header">
      <span>Scan Official Plate</span>
      <span class="close-modal" onclick="closeModal('scanModal')">&times;</span>
    </div>
    <input type="text" id="plateInput" class="input-field" placeholder="e.g. GG 1101 A">
    <button class="submit-btn" onclick="submitScan()">Analyze Asset Spending</button>
  </div>
</div>

<!-- Modal 2: Report Breakdown Output -->
<div class="modal" id="reportModal">
  <div class="modal-content">
    <div class="modal-header">
      <span>🔍 Spending Report</span>
      <span class="close-modal" onclick="closeModal('reportModal')">&times;</span>
    </div>
    <div id="reportContent"></div>
    <div class="share-row">
      <a id="waShare" class="share-btn wa-btn" target="_blank">WhatsApp</a>
      <a id="fbShare" class="share-btn fb-btn" target="_blank">Facebook</a>
      <button class="share-btn tt-btn" onclick="copyReportText()">Copy text</button>
    </div>
  </div>
</div>

<script>
  let currentShareText = "";

  function openScanModal() { 
    document.getElementById('scanModal').style.display = 'flex'; 
  }
  function closeModal(id) { 
    document.getElementById(id).style.display = 'none'; 
  }

  async function submitScan() {
    const rawInput = document.getElementById('plateInput').value.trim();
    if(!rawInput) return alert("Please type a license plate identifier first.");
    closeModal('scanModal');
    
    try {
      const res = await fetch(`/api/scan?plate=${encodeURIComponent(rawInput)}`);
      const payload = await res.json();
      if(!res.ok) return alert(payload.error || "Verification issue encountered.");
      showReport(payload.data);
    } catch(err) {
      alert("Error reaching endpoint. Complete your full Vercel deployment branch hook updates first.");
    }
  }

  function showReport(info) {
    document.getElementById('reportContent').innerHTML = `
      <div class="report-card">
        <div class="report-title">📋 ${info.plate.toUpperCase()} - ${info.model}</div>
        <div class="report-line"><span>Engine Size:</span> <b>${info.engine}</b></div>
        <div class="report-line"><span>Fuel Cost (5 Yrs):</span> <b>D ${info.breakdown.fuelCost.toLocaleString()}</b></div>
        <div class="report-line"><span>Grand Total Cost:</span> <b>D ${info.breakdown.grandTotal.toLocaleString()}</b></div>
      </div>
      <div class="equiv-grid">
        <div class="equiv-box"><div class="equiv-val">${info.equivalents.rice.toLocaleString()}</div><div class="equiv-lbl">Bags of Rice</div></div>
        <div class="equiv-box"><div class="equiv-val">${info.equivalents.tractors}</div><div class="equiv-lbl">Tractors</div></div>
        <div class="equiv-box"><div class="equiv-val">${info.equivalents.acUnits}</div><div class="equiv-lbl">AC Units</div></div>
        <div class="equiv-box"><div class="equiv-val">${info.equivalents.beds}</div><div class="equiv-lbl">Hospital Beds</div></div>
      </div>
    `;

    currentShareText = `🚨 GAMBIA VEHICLE TRANSPARENCY REPORT 🚨\nPlate: ${info.plate.toUpperCase()}\nModel: ${info.model}\nCombined 5-Yr Cost: D ${info.breakdown.grandTotal.toLocaleString()}\n\nInstead of running this ONE vehicle, public funds could buy:\n🌾 ${info.equivalents.rice.toLocaleString()} Bags of Rice\n🚜 ${info.equivalents.tractors} Tractors\n❄️ ${info.equivalents.acUnits} AC Units\n🛏️ ${info.equivalents.beds} Hospital Beds\n\n#GambiaBudgetTracker 🇬🇲`;
    
    document.getElementById('waShare').href = `https://whatsapp.com{encodeURIComponent(currentShareText)}`;
    document.getElementById('fbShare').href = `https://facebook.com{encodeURIComponent(window.location.href)}&quote=${encodeURIComponent(currentShareText)}`;
    document.getElementById('reportModal').style.display = 'flex';

    const feed = document.getElementById('historyFeed');
    const item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `
      <div class="car-thumb">${info.plate.substring(0,3).toUpperCase()}</div>
      <div class="item-details">
        <div class="item-title">${info.plate.toUpperCase()}</div>
        <div class="item-subtitle">${info.model}</div>
        <div class="status-badge"><span class="status-dot dot-red"></span>High Impact</div>
        <div class="time-stamp">⏱ Just Scanned</div>
      </div>
    `;
    feed.insertBefore(item, feed.firstChild);
  }

  function copyReportText() {
    navigator.clipboard.writeText(currentShareText);
    alert("Report text copied! Open TikTok or Facebook to paste.");
  }
</script>
</body>
</html>
