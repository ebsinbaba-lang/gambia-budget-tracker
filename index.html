<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gambia Vehicle Tracker</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f8f9fa;
      color: #212529;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 500px;
      width: 100%;
      text-align: center;
      margin-top: 40px;
    }
    .logo {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    p {
      color: #6c757d;
      font-size: 14px;
      margin-bottom: 30px;
      line-height: 1.5;
    }
    .input-box {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      border: 2px solid #dee2e6;
      border-radius: 8px;
      box-sizing: border-box;
      text-transform: uppercase;
      text-align: center;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      background-color: #198754;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    #btn-install {
      background-color: #0d6efd;
      margin-top: 15px;
      display: none;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .modal-content {
      background-color: white;
      padding: 25px;
      border-radius: 12px;
      max-width: 450px;
      width: 100%;
      text-align: left;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 24px;
      cursor: pointer;
      color: #6c757d;
    }
    .modal h2 {
      margin-top: 0;
      font-size: 20px;
      border-bottom: 2px solid #f1f3f5;
      padding-bottom: 10px;
    }
    .modal-field {
      margin-bottom: 15px;
    }
    .modal-label {
      font-weight: bold;
      font-size: 12px;
      color: #6c757d;
      text-transform: uppercase;
    }
    .modal-value {
      font-size: 16px;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">GM</div>
    <h1>Gambia Vehicle Tracker</h1>
    <p>Enter official government registration numbers to check financial allocations instantly.</p>
    
    <input type="text" id="plate-input" class="input-box" placeholder="e.g. NAM 112 A" maxlength="12">
    <button id="btn-scan" class="btn">➡️ Enter Registration Plate</button>
    <button id="btn-install" class="btn">📲 Install App</button>
  </div>

  <!-- Modal Screen -->
  <div id="result-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="close-modal">&times;</span>
      <h2 id="modal-model">Vehicle Details</h2>
      
      <div class="modal-field">
        <div class="modal-label">Estimated Cost</div>
        <div id="modal-cost" class="modal-value"></div>
      </div>
      <div class="modal-field">
        <div class="modal-label">Fuel Type</div>
        <div id="modal-fuel" class="modal-value"></div>
      </div>
      <div class="modal-field">
        <div id="modal-impact" class="modal-value"></div>
      </div>
      <div class="modal-field">
        <div id="modal-value" class="modal-value"></div>
      </div>
    </div>
  </div>

  <script>
    const inputEl = document.getElementById('plate-input');
    inputEl.addEventListener('input', (e) => {
      let val = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      
      let prefix = '';
      if (val.startsWith('NAM')) prefix = 'NAM';
      else if (val.startsWith('GG')) prefix = 'GG';
      else if (val.startsWith('SH')) prefix = 'SH';
      else if (val.startsWith('SG')) prefix = 'SG';
      else if (val.startsWith('PR')) prefix = 'PR';

      if (prefix) {
        let rest = val.substring(prefix.length);
        if (rest.length > 0) {
          let numbers = rest.match(/^\d+/);
          if (numbers) {
            let numStr = numbers;
            let lettersStr = rest.substring(numStr.length);
            if (lettersStr.length > 0) {
              val = `${prefix} ${numStr} ${lettersStr}`;
            } else {
              val = `${prefix} ${numStr}`;
            }
          } else {
            val = `${prefix} ${rest}`;
          }
        } else {
          val = prefix;
        }
      }
      e.target.value = val;
    });

    let deferredPrompt;
    const installBtn = document.getElementById('btn-install');

    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
      if (installBtn) installBtn.style.display = 'none';
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (installBtn && !window.matchMedia('(display-mode: standalone)').matches) {
        installBtn.style.display = 'block';
      }
    });

    if (installBtn) {
      installBtn.addEventListener('click', () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
              installBtn.style.display = 'none';
            }
            deferredPrompt = null;
          });
        }
      });
    }

    window.addEventListener('appinstalled', () => {
      if (installBtn) installBtn.style.display = 'none';
      deferredPrompt = null;
    });

    document.getElementById('btn-scan').addEventListener('click', executionScan);
    inputEl.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') executionScan();
    });

    function formatMarkdownText(text) {
      if (!text) return '';
      return text.replace(/\*\*(.*?)\*\:/g, '<strong>$1:</strong>');
    }

    async function executionScan() {
      const plate = inputEl.value.trim();
      if (!plate) return alert('Please enter a registration plate');

      try {
        const response = await fetch(`/api/scan?plate=${encodeURIComponent(plate)}`);
        if (!response.ok) {
          const errData = await response.json();
          return alert(errData.error || 'Registration not found');
        }
        
        const data = await response.json();
        
        document.getElementById('modal-model').innerText = data.model;
        document.getElementById('modal-cost').innerText = `D${data.estimatedCostDasi.toLocaleString()}`;
        document.getElementById('modal-fuel').innerText = `${data.fuelType} (Maint: D${data.monthlyFuelMaintenanceDasi.toLocaleString()}/mo)`;
        
        document.getElementById('modal-impact').innerHTML = formatMarkdownText(data.budgetImpact);
        document.getElementById('modal-value').innerHTML = formatMarkdownText(data.alternativePublicValue);
        
        document.getElementById('result-modal').style.display = 'flex';
      } catch (err) {
        alert('Error connecting to API logic.');
      }
    }

    document.getElementById('close-modal').addEventListener('click', () => {
      document.getElementById('result-modal').style.display = 'none';
    });
    window.addEventListener('click', (e) => {
      if (e.target === document.getElementById('result-modal')) {
        document.getElementById('result-modal').style.display = 'none';
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
